<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
<style>
@keyframes pp-sheet-in { from { opacity:0; transform:translateY(-8px) } to { opacity:1; transform:translateY(0) } }
</style>
</helmet>
<nav style="position:fixed;top:0;left:0;right:0;z-index:50;border-bottom:1px solid rgba(255,255,255,0.10);background:color-mix(in srgb, #1A1530 62%, transparent);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);box-shadow:inset 0 1px 0 rgba(255,255,255,0.08)">
  <div style="max-width:1140px;margin:0 auto;padding:0 clamp(16px,4vw,28px);height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px">
    <a href="index.html" style="display:flex;align-items:center;gap:10px;text-decoration:none;color:#F1ECE2">
      <img src="playproof-appicon.png" alt="" width="28" height="28" style="border-radius:7px;display:block;box-shadow:0 2px 8px rgba(0,0,0,0.35)">
      <span style="font-weight:800;font-size:20px;letter-spacing:-0.02em">Playproof</span>
    </a>

    <sc-if value="{{ showDesktop }}" hint-placeholder-val="{{ true }}">
      <div style="display:flex;align-items:center;gap:6px;font-size:14.5px">
        <sc-for list="{{ links }}" as="link" hint-placeholder-count="4">
          <a href="{{ link.href }}" style="color:{{ link.color }};font-weight:{{ link.weight }};text-decoration:none;padding:8px 12px;border-radius:9px;transition:color .12s,background .12s" style-hover="background:rgba(255,255,255,0.06);color:#F1ECE2">{{ link.label }}</a>
        </sc-for>
        <a href="download.html" style="margin-left:6px;background:linear-gradient(180deg,#E8A24E,#cf8838);color:#1b1430;font-weight:800;padding:9px 17px;border-radius:10px;text-decoration:none;box-shadow:0 6px 18px rgba(232,162,78,0.28);transition:transform .12s" style-hover="transform:translateY(-1px)">Download</a>
      </div>
    </sc-if>

    <sc-if value="{{ showMobile }}" hint-placeholder-val="{{ false }}">
      <div style="display:flex;align-items:center;gap:10px">
        <a href="download.html" style="background:linear-gradient(180deg,#E8A24E,#cf8838);color:#1b1430;font-weight:800;padding:9px 15px;border-radius:10px;text-decoration:none;font-size:14px">Download</a>
        <button type="button" onClick="{{ toggle }}" aria-label="Menu" aria-expanded="{{ open }}" style="display:flex;flex-direction:column;justify-content:center;gap:5px;width:42px;height:42px;align-items:center;border:1px solid rgba(255,255,255,0.16);border-radius:11px;background:rgba(255,255,255,0.04);cursor:pointer;padding:0">
          <span style="display:block;width:18px;height:2px;border-radius:2px;background:#F1ECE2;transition:transform .18s,opacity .18s;transform:{{ bar1 }}"></span>
          <span style="display:block;width:18px;height:2px;border-radius:2px;background:#F1ECE2;transition:opacity .18s;opacity:{{ bar2op }}"></span>
          <span style="display:block;width:18px;height:2px;border-radius:2px;background:#F1ECE2;transition:transform .18s;transform:{{ bar3 }}"></span>
        </button>
      </div>
    </sc-if>
  </div>

  <sc-if value="{{ showSheet }}" hint-placeholder-val="{{ false }}">
    <div style="border-top:1px solid rgba(255,255,255,0.08);background:color-mix(in srgb, #1A1530 80%, transparent);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);animation:pp-sheet-in .18s ease">
      <div style="max-width:1140px;margin:0 auto;padding:10px clamp(16px,4vw,28px) 18px;display:flex;flex-direction:column;gap:2px">
        <sc-for list="{{ links }}" as="link" hint-placeholder-count="4">
          <a href="{{ link.href }}" onClick="{{ close }}" style="display:flex;align-items:center;justify-content:space-between;color:{{ link.color }};font-weight:{{ link.weight }};text-decoration:none;padding:14px 6px;border-bottom:1px solid rgba(255,255,255,0.06);font-size:17px">
            <span>{{ link.label }}</span>
            <span style="color:#5b5070;font-size:15px">&rsaquo;</span>
          </a>
        </sc-for>
      </div>
    </div>
  </sc-if>
</nav>
<div style="height:64px"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:300},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;&quot;,&quot;tour&quot;,&quot;guides&quot;,&quot;features&quot;,&quot;support&quot;],&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, isMobile: false };

  componentDidMount() {
    this._sync = () => {
      const m = window.innerWidth < 820;
      this.setState(s => ({ isMobile: m, open: m ? s.open : false }));
    };
    this._sync();
    window.addEventListener('resize', this._sync);
  }
  componentWillUnmount() { window.removeEventListener('resize', this._sync); }

  renderVals() {
    const current = this.props.current || '';
    const defs = [
      { href: 'how-it-works.html', label: 'How it works', id: 'how' },
      { href: 'guides.html', label: 'Get Started', id: 'guides' },
      { href: 'support.html', label: 'Support', id: 'support' },
    ];
    const links = defs.map(d => {
      const active = d.id === current;
      return { href: d.href, label: d.label, color: active ? '#E8A24E' : '#B79E86', weight: active ? '700' : '500' };
    });
    const { open, isMobile } = this.state;
    return {
      links,
      open,
      showDesktop: !isMobile,
      showMobile: isMobile,
      showSheet: isMobile && open,
      bar1: open ? 'translateY(7px) rotate(45deg)' : 'none',
      bar2op: open ? '0' : '1',
      bar3: open ? 'translateY(-7px) rotate(-45deg)' : 'none',
      toggle: () => this.setState(s => ({ open: !s.open })),
      close: () => this.setState({ open: false }),
    };
  }
}
</script>
</body>
</html>
